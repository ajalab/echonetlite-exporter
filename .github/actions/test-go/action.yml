name: Test Go project

description: |
  Test go project.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore cache
      uses: actions/cache/restore@v4
      id: go-cache
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-
    - name: Restore MRA cache
      id: mra-cache
      uses: actions/cache/restore@v4
      with:
        path: third_party/echonet-lite-mra/MRA_v*/
        key: echonet-lite-mra-${{ runner.os }}-${{ hashFiles('third_party/echonet-lite-mra/fetch.sh') }}
    - name: Fetch MRA
      id: fetch-mra
      run: |
        mra_dir="$(./third_party/echonet-lite-mra/fetch.sh)"
        printf 'path=%s\n' "$mra_dir" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Save MRA cache
      if: steps.mra-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: third_party/echonet-lite-mra/MRA_v*/
        key: ${{ steps.mra-cache.outputs.cache-primary-key }}
    - name: Test
      run: |
        set -e -o pipefail
        go test ./... -json | tee test-result.json
      env:
        ECHONETLITE_MRA_DIR: ${{ steps.fetch-mra.outputs.path }}
      shell: bash
    - name: Upload Go test results
      uses: actions/upload-artifact@v4
      with:
          name: test-result
          path: test-result.json
    - name: Save cache
      uses: actions/cache/save@v4
      if: github.ref_name == 'main' && steps.go-cache.outputs.cache-hit != 'true'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ steps.go-cache.outputs.cache-primary-key }}
