name: Release

on:
  release:
    types:
      - published

jobs:
  build-release-assets:
    strategy:
      matrix:
        os:
          - linux
          - darwin
        arch:
          - amd64
          - arm64
        format:
          - tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Go
        id: build
        uses: ./.github/actions/build-go/
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
      - name: Upload release asset as artifact
        uses: ./.github/actions/upload-artifact-release-asset
        with:
          path: >
            ${{ steps.build.outputs.target }}
            LICENSE
          name: echonetlite-exporter-${{ github.ref_name }}.${{ matrix.os }}-${{ matrix.arch }}
          format: ${{ matrix.format }}

  upload-release-assets:
    needs: build-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Compute sha256sums
        run: |
          cd assets
          sha256sum * > $SHA256SUMS_FILE
        env:
          SHA256SUMS_FILE: echonetlite-exporter-${{ github.ref_name }}.sha256sums.txt
      - name: Upload the assets to the release
        run: gh release upload -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
